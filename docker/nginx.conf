# Umi/React Web 应用的 Nginx 配置文件
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # 引入 conf.d 文件夹下的各个子配置文件
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  localhost;

        root         /usr/share/nginx/html;

        # 访问根目录 / 时重定向到 /flow/，因为 Umi 应用配置在 /flow/ 路径下运行
        location = / {
            return 301 /flow/;
        }

        # 前端应用的静态资源及路由配置
        location /flow/ {
            alias  /usr/share/nginx/html/flow/;
            index  index.html index.htm;
            try_files $uri $uri/ /flow/index.html;
        }

        # 配置 /flow/docs/ 路径下的静态资源文件缓存
        location ~* ^/flow/docs/(.*)\.(jpg|png|jpeg|gif|mp4|mp3|pdf|docx|txt|heic)$ {
            alias /usr/share/nginx/html/flow/docs/$1.$2;
            expires 24h;
        }

        # 文档路由配置
        location /flow/docs {
            alias  /usr/share/nginx/html/flow/docs/;
            try_files $uri $uri/ /flow/docs/index.html;
        }

        # 外部链接重定向示例
        location /bd {
            rewrite ^(.*)$ http://www.baidu.com break;
        }

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
