
services:
  blob-app:
    build:
      # 构建上下文设为当前所在目录 (方便进入该目录后直接运行)
      context: .
      dockerfile: Dockerfile
    container_name: blob-app
    ports:
      - "80:80"
    volumes:
      # 挂载本地打包的 flow 目录。后续在服务器更新 flow 下的静态文件时立刻生效，无需重启或重新构建容器
      - ./flow:/usr/share/nginx/html/flow
      # 挂载 Nginx 配置文件。若更改了配置，仅需执行 docker exec blob-app nginx -s reload 即可，无需重启
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    restart: always
    environment:
      - NODE_ENV=production
